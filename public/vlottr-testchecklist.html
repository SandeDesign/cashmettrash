<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlottr — Testchecklist v1.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#111111;--surface2:#1a1a1a;--border:rgba(255,255,255,0.1);--text:#ffffff;--muted:#737373;--accent:#22c55e;--accent2:#4ade80;--green:#22c55e;--green-bg:rgba(34,197,94,.13);--red:#ef4444;--red-bg:rgba(239,68,68,.13);--amber:#f97316;--radius:8px;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:16px;color:var(--accent)}
.logo span{color:var(--muted);font-weight:400}
.version{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.tester-wrap{display:flex;align-items:center;gap:6px;margin-left:4px}
.tester-label{font-size:12px;color:var(--muted);white-space:nowrap}
.tester-input{padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;outline:none;width:160px}
.tester-input:focus{border-color:var(--accent)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog-text{font-size:13px;color:var(--muted)}
.prog-pct{font-size:13px;font-weight:600;color:var(--green)}
.btn{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--border)}
.btn-danger{border-color:rgba(239,68,68,.4);color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,.12)}
.progress-bar{height:3px;background:var(--border);position:sticky;top:53px;z-index:99;display:flex}
.pg{height:100%;transition:width .3s}
.main{max-width:860px;margin:0 auto;padding:20px 16px 100px}
.legend{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-dot{width:11px;height:11px;border-radius:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .15s}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:500}
.stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;flex:1;min-width:90px}
.stat-num{font-size:20px;font-weight:700}
.stat-num.green{color:var(--green)}.stat-num.red{color:var(--red)}.stat-num.amber{color:var(--amber)}.stat-num.muted{color:var(--muted)}
.stat-label{font-size:11px;color:var(--muted);margin-top:1px}
.search{width:100%;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;margin-bottom:14px;outline:none}
.search:focus{border-color:var(--accent)}
.section{margin-bottom:6px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section-header{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;background:var(--surface);user-select:none;transition:background .15s}
.section-header:hover{background:var(--surface2)}
.section-num{font-size:11px;font-weight:700;color:var(--accent);min-width:26px}
.section-title{flex:1;font-weight:500;font-size:13px}
.sbadges{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sc{font-size:11px;padding:1px 6px;border-radius:4px}
.sc-g{background:rgba(34,197,94,.15);color:var(--green)}
.sc-r{background:rgba(239,68,68,.15);color:var(--red)}
.sc-o{background:var(--surface2);color:var(--muted)}
.chevron{color:var(--muted);font-size:11px;transition:transform .2s;margin-left:4px;flex-shrink:0}
.section.open .chevron{transform:rotate(90deg)}
.section-progress{height:2px;background:var(--border);display:flex}
.sp-g{height:100%;background:var(--green);transition:width .3s}
.sp-r{height:100%;background:var(--red);transition:width .3s}
.section-body{display:none;padding:4px 0 8px}
.section.open .section-body{display:block}
.subsection{padding:8px 16px 2px}
.sub-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.sub-link{font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(34,197,94,.1);color:var(--accent);border:1px solid rgba(34,197,94,.25);text-decoration:none;font-weight:600;text-transform:none;letter-spacing:0;flex-shrink:0;transition:background .15s}
.sub-link:hover{background:rgba(34,197,94,.22)}
.item{display:flex;align-items:flex-start;gap:10px;padding:5px 8px;border-radius:6px;cursor:pointer;transition:background .1s;user-select:none}
.item:hover{background:var(--surface2)}
.item.st-ok{background:var(--green-bg)}
.item.st-fail{background:var(--red-bg)}
.cb{width:16px;height:16px;min-width:16px;border-radius:4px;border:1.5px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;margin-top:2px;font-size:10px;font-weight:700;transition:all .15s;flex-shrink:0}
.item.st-ok .cb{background:var(--green);border-color:var(--green);color:#000}
.item.st-fail .cb{background:var(--red);border-color:var(--red);color:#fff}
.item-label{flex:1;font-size:13px;line-height:1.4}
.item.st-ok .item-label{color:rgba(34,197,94,.6);text-decoration:line-through;text-decoration-color:rgba(34,197,94,.35)}
.item.st-fail .item-label{color:rgba(239,68,68,.6);text-decoration:line-through;text-decoration-color:rgba(239,68,68,.35)}
.role-badge{font-size:10px;padding:1px 6px;border-radius:20px;white-space:nowrap;margin-left:2px}
.badge-manager{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.badge-admin{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.badge-partner{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.3)}
.pdf-btn-wrap{position:fixed;bottom:24px;right:24px;z-index:200}
.pdf-btn-big{padding:12px 28px;border-radius:12px;background:var(--accent);color:#000;border:none;cursor:pointer;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(34,197,94,.4);transition:transform .15s,box-shadow .15s}
.pdf-btn-big:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(34,197,94,.5)}
.empty-state{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:600px){.topbar{padding:10px 12px}.main{padding:14px 10px 100px}.stats-bar{gap:8px}.stat{padding:8px 12px}.pdf-btn-wrap{bottom:16px;right:16px}.tester-input{width:120px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">Vlottr <span>testchecklist</span></span>
  <span class="version">v1.0</span>
  <div class="tester-wrap">
    <span class="tester-label">Tester:</span>
    <input class="tester-input" type="text" id="tester-name" placeholder="Jouw naam..." oninput="saveTester()" autocomplete="off">
  </div>
  <div class="topbar-right">
    <span class="prog-text" id="prog-text">0 / 0</span>
    <span class="prog-pct" id="prog-pct">0%</span>
    <button class="btn" onclick="expandAll()">Alles open</button>
    <button class="btn" onclick="collapseAll()">Alles dicht</button>
    <button class="btn btn-danger" onclick="confirmReset()">Reset</button>
  </div>
</div>
<div class="progress-bar">
  <div class="pg" id="pg-green" style="background:var(--green)"></div>
  <div class="pg" id="pg-red" style="background:var(--red)"></div>
</div>
<div class="main">
  <div class="stats-bar" id="stats-bar"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>1x klik = gefikst / OK</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>2x klik = niet gefikst / FAIL</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div>3x klik = terug open</div>
    <div class="legend-item"><span class="role-badge badge-manager">Manager</span> manager rol vereist</div>
    <div class="legend-item"><span class="role-badge badge-admin">Admin</span> admin rol vereist</div>
    <div class="legend-item"><span class="role-badge badge-partner">Partner</span> partner rol vereist</div>
  </div>
  <input class="search" type="text" id="search" placeholder="Zoeken in checklist..." oninput="doSearch()">
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</div>
<div class="pdf-btn-wrap">
  <button class="pdf-btn-big" onclick="exportPDF()">PDF resultaat exporteren</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const SK="vlottr_cl_v100";
const TK="vlottr_tester_v100";
let state={},activeFilter="all";
function load(){
  try{state=JSON.parse(localStorage.getItem(SK)||"{}");}catch(e){state={};}
  const tn=localStorage.getItem(TK)||"";
  const inp=document.getElementById("tester-name");
  if(inp)inp.value=tn;
}
function save(){localStorage.setItem(SK,JSON.stringify(state));}
function saveTester(){const v=document.getElementById("tester-name").value;localStorage.setItem(TK,v);}
function ik(s,sub,i){return s+"__"+sub+"__"+i;}
function totals(){
  let ok=0,fail=0,tot=0;
  DATA.forEach(s=>s.sub.forEach(sub=>sub.items.forEach((_,i)=>{
    tot++;const v=state[ik(s.id,sub.id,i)]||0;
    if(v===1)ok++;else if(v===2)fail++;
  })));
  return{ok,fail,tot,open:tot-ok-fail};
}
function secTotals(sec){
  let ok=0,fail=0,tot=0;
  sec.sub.forEach(sub=>sub.items.forEach((_,i)=>{
    tot++;const v=state[ik(sec.id,sub.id,i)]||0;
    if(v===1)ok++;else if(v===2)fail++;
  }));
  return{ok,fail,tot};
}
function updateUI(){
  const{ok,fail,tot,open}=totals();
  const pOk=tot?Math.round(ok/tot*100):0;
  const pFail=tot?Math.round(fail/tot*100):0;
  document.getElementById("prog-text").textContent=ok+" / "+tot;
  document.getElementById("prog-pct").textContent=pOk+"%";
  document.getElementById("pg-green").style.width=pOk+"%";
  document.getElementById("pg-red").style.width=pFail+"%";
  document.getElementById("stats-bar").innerHTML=
    `<div class="stat"><div class="stat-num green">${ok}</div><div class="stat-label">Gefikst / OK</div></div>`+
    `<div class="stat"><div class="stat-num red">${fail}</div><div class="stat-label">Niet gefikst</div></div>`+
    `<div class="stat"><div class="stat-num amber">${open}</div><div class="stat-label">Open</div></div>`+
    `<div class="stat"><div class="stat-num muted">${tot}</div><div class="stat-label">Totaal</div></div>`;
  DATA.forEach(sec=>{
    const bg=document.getElementById("sg-"+sec.id),br=document.getElementById("sr-"+sec.id),bc=document.getElementById("sc-"+sec.id);
    if(!bg)return;
    const{ok:so,fail:sf,tot:st}=secTotals(sec);
    bg.style.width=(st?Math.round(so/st*100):0)+"%";
    br.style.width=(st?Math.round(sf/st*100):0)+"%";
    bc.innerHTML=(so?`<span class="sc sc-g">${so} ok</span>`:"")+
      (sf?`<span class="sc sc-r">${sf} fail</span>`:"")+
      ((st-so-sf)>0?`<span class="sc sc-o">${st-so-sf} open</span>`:"");
  });
}
function toggle(key){
  const cur=state[key]||0;
  state[key]=(cur+1)%3;
  save();
  const el=document.getElementById("i-"+key);
  if(!el)return;
  const v=state[key];
  el.className="item"+(v===1?" st-ok":v===2?" st-fail":"");
  const cb=el.querySelector(".cb");
  if(cb)cb.textContent=v===1?"✓":v===2?"✗":"";
  updateUI();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function roleBadge(role){
  if(!role)return"";
  const map={manager:'<span class="role-badge badge-manager">Manager</span>',admin:'<span class="role-badge badge-admin">Admin</span>',partner:'<span class="role-badge badge-partner">Partner</span>'};
  return map[role]||"";
}
function buildList(q){
  q=(q||"").toLowerCase().trim();
  let html="";
  DATA.forEach(sec=>{
    if(activeFilter==="manager"&&sec.role!=="manager")return;
    if(activeFilter==="admin"&&sec.role!=="admin")return;
    if(activeFilter==="partner"&&sec.role!=="partner")return;
    if(activeFilter==="fail"){
      let has=false;
      sec.sub.forEach(sub=>sub.items.forEach((_,i)=>{if((state[ik(sec.id,sub.id,i)]||0)===2)has=true;}));
      if(!has)return;
    }
    if(activeFilter==="open"){
      let has=false;
      sec.sub.forEach(sub=>sub.items.forEach((_,i)=>{if(!(state[ik(sec.id,sub.id,i)]||0))has=true;}));
      if(!has)return;
    }
    let secHtml="";
    sec.sub.forEach(sub=>{
      let subHtml="";
      sub.items.forEach((item,i)=>{
        if(q&&!item.toLowerCase().includes(q)&&!sub.title.toLowerCase().includes(q)&&!sec.title.toLowerCase().includes(q))return;
        const key=ik(sec.id,sub.id,i),v=state[key]||0;
        const cls=v===1?" st-ok":v===2?" st-fail":"";
        const tick=v===1?"✓":v===2?"✗":"";
        subHtml+=`<div class="item${cls}" id="i-${key}" onclick="toggle('${key}')"><div class="cb">${tick}</div><span class="item-label">${esc(item)}</span></div>`;
      });
      const subUrl=URLS[sub.id];
      const subLinkHtml=subUrl?` <a class="sub-link" href="${subUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ open</a>`:"";
      if(subHtml)secHtml+=`<div class="subsection"><div class="sub-title"><span>${esc(sub.id)} — ${esc(sub.title)}</span>${subLinkHtml}</div>${subHtml}</div>`;
    });
    if(!secHtml)return;
    const{ok,fail,tot}=secTotals(sec);
    html+=`<div class="section open" id="sec-${sec.id}">
      <div class="section-header" onclick="toggleSec('${sec.id}')">
        <span class="section-num">${esc(sec.id)}</span>
        <span class="section-title">${esc(sec.title)} ${roleBadge(sec.role)}</span>
        <div class="sbadges" id="sc-${sec.id}">
          ${ok?`<span class="sc sc-g">${ok} ok</span>`:""}
          ${fail?`<span class="sc sc-r">${fail} fail</span>`:""}
          ${(tot-ok-fail)>0?`<span class="sc sc-o">${tot-ok-fail} open</span>`:""}
        </div>
        <span class="chevron">▶</span>
      </div>
      <div class="section-progress">
        <div class="sp-g" id="sg-${sec.id}" style="width:${tot?Math.round(ok/tot*100):0}%"></div>
        <div class="sp-r" id="sr-${sec.id}" style="width:${tot?Math.round(fail/tot*100):0}%"></div>
      </div>
      <div class="section-body">${secHtml}</div>
    </div>`;
  });
  document.getElementById("list").innerHTML=html||`<div class="empty-state">Geen resultaten gevonden.</div>`;
  updateUI();
}
function toggleSec(id){const el=document.getElementById("sec-"+id);if(el)el.classList.toggle("open");}
function expandAll(){document.querySelectorAll(".section").forEach(el=>el.classList.add("open"));}
function collapseAll(){document.querySelectorAll(".section").forEach(el=>el.classList.remove("open"));}
function doSearch(){buildList(document.getElementById("search").value);}
function confirmReset(){if(confirm("Alle voortgang resetten? Dit kan niet ongedaan worden gemaakt.")){state={};save();buildList(document.getElementById("search").value);}}
function buildFilters(){
  const f=[
    {id:"all",label:"Alles"},
    {id:"open",label:"Open"},
    {id:"fail",label:"Niet gefikst"},
    {id:"manager",label:"Manager"},
    {id:"admin",label:"Admin"},
    {id:"partner",label:"Partner"}
  ];
  document.getElementById("filters").innerHTML=f.map(x=>`<button class="filter-btn${activeFilter===x.id?" active":""}" onclick="setFilter('${x.id}')">${x.label}</button>`).join("");
}
function setFilter(id){activeFilter=id;buildFilters();buildList(document.getElementById("search").value);}
function exportPDF(){
  if(!window.jspdf){alert("jsPDF nog niet geladen.");return;}
  const testerName=document.getElementById("tester-name").value.trim()||"Onbekend";
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210,M=14,CW=W-M*2;
  const now=new Date();
  const ds=now.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit",year:"numeric"});
  const{ok,fail,tot,open}=totals();
  const pct=tot?Math.round(ok/tot*100):0;
  // Header
  doc.setFillColor(15,50,30);
  doc.rect(0,0,W,34,"F");
  doc.setFillColor(34,197,94);
  doc.rect(0,0,4,34,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");doc.setFontSize(15);
  doc.text("Vlottr — Testchecklist v1.0",M+2,11);
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);
  doc.text("Tester: "+testerName,M+2,18);
  doc.text("Gegenereerd: "+ds,M+2,24);
  doc.setTextColor(34,197,94);
  doc.text("Gefikst: "+ok+"   Niet gefikst: "+fail+"   Open: "+open+"   "+pct+"% compleet",M+2,30);
  let y=40;
  // Progress bar
  doc.setFillColor(30,30,30);
  doc.roundedRect(M,y,CW,4,1,1,"F");
  if(ok>0){doc.setFillColor(34,197,94);doc.roundedRect(M,y,CW*(ok/tot),4,1,1,"F");}
  if(fail>0){doc.setFillColor(239,68,68);doc.rect(M+CW*(ok/tot),y,CW*(fail/tot),4,"F");}
  y+=7;
  // Legend
  doc.setFontSize(7.5);
  doc.setFillColor(34,197,94);doc.rect(M,y,3,3,"F");
  doc.setTextColor(51,65,85);doc.text("Gefikst",M+4.5,y+2.4);
  doc.setFillColor(239,68,68);doc.rect(M+20,y,3,3,"F");
  doc.text("Niet gefikst",M+24.5,y+2.4);
  doc.setFillColor(180,180,180);doc.rect(M+44,y,3,3,"F");
  doc.text("Open",M+48.5,y+2.4);
  y+=9;
  function checkPage(needed){
    if(y+needed>282){doc.addPage();y=M;}
  }
  DATA.forEach(sec=>{
    const{ok:so,fail:sf,tot:st}=secTotals(sec);
    if(st===0)return;
    checkPage(12);
    const roleLabel=sec.role?(" ["+sec.role.toUpperCase()+"]"):"";
    // Section header
    doc.setFillColor(15,50,30);
    doc.rect(M,y,CW,7,"F");
    doc.setFillColor(34,197,94);
    doc.rect(M,y,2,7,"F");
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    const stitle=sec.id+" — "+sec.title+roleLabel;
    doc.text(stitle,M+4,y+5);
    const sum=so+" ok   "+sf+" fail   "+(st-so-sf)+" open";
    doc.text(sum,W-M-2,y+5,{align:"right"});
    y+=7;
    // Section progress
    doc.setFillColor(30,30,30);
    doc.rect(M,y,CW,1.5,"F");
    if(so>0){doc.setFillColor(34,197,94);doc.rect(M,y,CW*(so/st),1.5,"F");}
    if(sf>0){doc.setFillColor(239,68,68);doc.rect(M+CW*(so/st),y,CW*(sf/st),1.5,"F");}
    y+=4;
    sec.sub.forEach(sub=>{
      checkPage(8);
      doc.setFont("helvetica","bold");doc.setFontSize(7.5);
      doc.setTextColor(80,100,80);
      doc.text(sub.id+" — "+sub.title,M+2,y);
      y+=4.5;
      sub.items.forEach((item,i)=>{
        checkPage(5);
        const v=state[ik(sec.id,sub.id,i)]||0;
        if(v===1){doc.setTextColor(22,120,74);doc.setFont("helvetica","normal");}
        else if(v===2){doc.setTextColor(200,38,38);doc.setFont("helvetica","normal");}
        else{doc.setTextColor(71,85,105);doc.setFont("helvetica","normal");}
        doc.setFontSize(8);
        const mark=v===1?"[OK] ":v===2?"[!!] ":"[ ]  ";
        const full=mark+item;
        const lines=doc.splitTextToSize(full,CW-5);
        lines.forEach(ln=>{
          checkPage(4.5);
          doc.text(ln,M+4,y);
          y+=4.2;
        });
      });
      y+=1.5;
    });
    y+=3;
  });
  // Pagina footer
  const pages=doc.internal.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setFontSize(7);doc.setTextColor(148,163,184);
    doc.text("Vlottr Testchecklist v1.0 — Tester: "+testerName+" — "+ds+" — Pagina "+p+" van "+pages,W/2,291,{align:"center"});
  }
  doc.save("vlottr-testresultaat-"+now.toISOString().slice(0,10)+".pdf");
}
load();buildFilters();buildList();
</script>
