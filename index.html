    <!--
      Opstartscherm. Staat bewust inline in de HTML en niet in React: het moet
      zichtbaar zijn voordat de bundle geladen is, anders zie je eerst een witte
      pagina. main.tsx haalt het weg zodra de app gemonteerd is.
    -->
    <style>
      #cmt-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #f5f3ee;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        transition: opacity 0.35s ease;
      }
      #cmt-splash.cmt-splash-weg {
        opacity: 0;
        pointer-events: none;
      }
      .cmt-splash-mark {
        width: 132px;
        height: 132px;
        animation: cmt-splash-op 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* De ring tekent zich rond het karakter. */
      .cmt-splash-ring {
        stroke-dasharray: 1885;
        stroke-dashoffset: 1885;
        animation: cmt-splash-ring 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      /* De munt zakt in de bak en herhaalt rustig. */
      .cmt-splash-munt {
        animation: cmt-splash-munt 1.6s ease-in-out 0.7s infinite;
      }
      .cmt-splash-woord {
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #14181f;
        animation: cmt-splash-op 0.5s ease 0.35s both;
      }
      .cmt-splash-woord span {
        color: #0e8f6c;
      }
      @keyframes cmt-splash-op {
        from { opacity: 0; transform: translateY(8px) scale(0.96); }
        to { opacity: 1; transform: none; }
      }
      @keyframes cmt-splash-ring {
        to { stroke-dashoffset: 0; }
      }
      @keyframes cmt-splash-munt {
        0%, 100% { transform: translateY(0); opacity: 1; }
        45% { transform: translateY(26px); opacity: 0.35; }
        55% { transform: translateY(26px); opacity: 0; }
        70% { transform: translateY(-6px); opacity: 0; }
        85% { transform: translateY(0); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cmt-splash-mark,
        .cmt-splash-ring,
        .cmt-splash-munt,
        .cmt-splash-woord {
          animation: none;
        }
        .cmt-splash-ring { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="cmt-splash" role="status" aria-label="CashMetTrash wordt geladen">
      <svg class="cmt-splash-mark" viewBox="0 0 640 640" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="s-body" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1FA97F" /><stop offset="55%" stop-color="#0E8F6C" /><stop offset="100%" stop-color="#0A6E54" />
          </linearGradient>
          <linearGradient id="s-lid" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1560C9" /><stop offset="100%" stop-color="#0B4A9E" />
          </linearGradient>
        </defs>
        <circle cx="320" cy="320" r="306" fill="#ffffff" />
        <circle class="cmt-splash-ring" cx="320" cy="320" r="300" fill="none" stroke="#0B4A9E" stroke-width="12"
                transform="rotate(-90 320 320)" />
        <g transform="translate(320 320) scale(1.28) translate(-320 -262.5)">
          <ellipse cx="320" cy="420" rx="100" ry="13" fill="#0A6E54" opacity="0.15" />
          <ellipse cx="280" cy="408" rx="16" ry="8" fill="#0A6E54" />
          <ellipse cx="356" cy="408" rx="16" ry="8" fill="#0A6E54" />
          <rect x="271" y="375" width="18" height="36" rx="9" fill="#0E8F6C" />
          <rect x="347" y="375" width="18" height="36" rx="9" fill="#0E8F6C" />
          <path d="M232 250 Q184 234 180 193" stroke="#0E8F6C" stroke-width="20" stroke-linecap="round" fill="none" />
          <path d="M408 250 Q456 234 460 193" stroke="#0E8F6C" stroke-width="20" stroke-linecap="round" fill="none" />
          <circle cx="179" cy="189" r="13" fill="#1FA97F" />
          <circle cx="461" cy="189" r="13" fill="#1FA97F" />
          <g class="cmt-splash-munt">
            <circle cx="320" cy="164" r="35" fill="#ffffff" stroke="#0B4A9E" stroke-width="4" />
            <text x="320" y="178" font-weight="700" font-size="38" fill="#0B4A9E" text-anchor="middle">&#8364;</text>
          </g>
          <path d="M240 236 L262 382 Q320 400 378 382 L400 236 Q320 260 240 236 Z" fill="url(#s-body)" />
          <path d="M257 248 L271 362 Q286 368 286 368 L273 244 Z" fill="#FFFFFF" opacity="0.18" />
          <path d="M225 209 Q320 171 415 209 L402 239 Q320 265 238 239 Z" fill="url(#s-lid)" />
          <ellipse cx="320" cy="209" rx="90" ry="20" fill="#1560C9" />
          <ellipse cx="320" cy="209" rx="39" ry="11" fill="#063A7A" />
          <circle cx="291" cy="292" r="10" fill="#FFFFFF" /><circle cx="291" cy="292" r="5" fill="#0A3A2C" />
          <circle cx="349" cy="292" r="10" fill="#FFFFFF" /><circle cx="349" cy="292" r="5" fill="#0A3A2C" />
          <path d="M278 321 Q320 353 362 321" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" />
        </g>
      </svg>

      <p class="cmt-splash-woord">Cash<span>Met</span>Trash</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    if (window.confirm('Er is een nieuwe versie beschikbaar. Nu vernieuwen?')) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  }
                });
              });

              setInterval(() => registration.update(), 30 * 60 * 1000);

              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) registration.update();
              });
            })
            .catch((error) => {
              console.error('[CashMetTrash] Service worker registratie mislukt:', error);
            });
        });
      }
    </script>
  </body>
</html>
