    <meta name="description" content="Glas en statiegeld laten ophalen in Tilburg, rond de Magriethof. Jayce komt het met de skelter ophalen." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CashMetTrash" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>CashMetTrash, glas en statiegeld ophalen in Tilburg</title>

    <meta property="og:title" content="CashMetTrash" />
    <meta property="og:description" content="Glas en statiegeld laten ophalen in Tilburg, rond de Magriethof." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    if (window.confirm('Er is een nieuwe versie beschikbaar. Nu vernieuwen?')) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  }
                });
              });

              setInterval(() => registration.update(), 30 * 60 * 1000);

              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) registration.update();
              });
            })
            .catch((error) => {
              console.error('[CashMetTrash] Service worker registratie mislukt:', error);
            });
        });
      }
    </script>
  </body>
</html>
